apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortner-deployment
  labels:
    app: url-shortner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-shortner
  template:
    metadata:
      labels:
        app: url-shortner
    spec:
      containers:
        - name: url-shortner
          image: url-shortner:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080